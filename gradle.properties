# === V 1.17.0 — الجولة الشاملة السابعة عشرة: جودة عالمية — التصحيح التلقائي الحقيقي + الوصول الشامل (TalkBack) + حذف الحركة أولًا + أداء المحرر الضخم ===
# V 1.17.0 — seventeenth comprehensive round, world-class quality:
# (1) TRUE autocorrect — until now NO candidate was ever auto-commit
# eligible, so space always committed the typo verbatim; the new pure
# AutocorrectDecider gates the existing auto-commit plumbing
# conservatively (no dictionary prefix match = genuine typo, >= 3
# letters, top correction frequency >= 170/255, pref on) and the
# provider marks that first correction eligible so pressing space
# silently fixes the word while backspace reverts (revert plumbing
# already existed); TOGGLE_AUTOCORRECT now flips the REAL behavior
# instead of hiding the suggestion row, with the same toast contract;
# a SwitchPreference lands in Typing settings.
# (2) Accessibility — the keyboard finally speaks: TextKeyButton gains
# semantics { role=Button, contentDescription } where icon-only keys
# (shift/caps/backspace/arrows/enter/page moves/view switches incl.
# the harakat page) resolve localized spoken labels through the new
# pure keyA11yLabelRes mapping, character keys speak their label;
# emoji tiles announce the emoji itself; clipboard media tiles
# announce image/video/pinned badge instead of null. 17 new a11y keys.
# (3) Haraka-first backspace — deleteBackwards peels ONE diacritic off
# the letter per tap (mirroring the rich-editor delete path with a
# fixed single-codepoint length) instead of the ICU grapheme cluster
# deleting letter+marks in one go; pure
# HarakatSmartInsert.shouldStripBeforeDelete decides; pref
# keyboard__backspace_strips_harakat (default on) surfaced in Keyboard
# settings.
# (4) 500K-editor search moved OFF the main thread behind a 150 ms
# debounce in BOTH editors (popup window + in-panel), ending the
# synchronous full-text rescan per keystroke.
# (5) Platform hygiene: StrictMode (thread + VM) in debug builds only;
# the effectively-empty ur-PK (0 strings) and 2-key nds-DE locale dirs
# removed and dropped from localeConfig so per-app-language offers
# only real languages (44 -> 42 entries); CHANGELOG.md generated from
# the 26 release tags; 24 new AR/EN string keys (parity 2341).
# === V 1.16.0 — الجولة الشاملة السادسة عشرة: لوحة الحركات كلوحة مفاتيح كاملة، شريط المهام الثابت بعشر خانات، والترتيب الذكي للوحات — «انا طلبت لوحة مفاتيح مشابه تماماً للوحة الحروف او الارقام ولكنها عباره عن حركات / وايضآ شريط المهام اجعله ثابتآ يعرض 10مهام فقط مع امكانية تغيرها وتعديلها / واعد ترتيب وتتطوير جميع الوحات بنظام مرتب وذكي» ===
