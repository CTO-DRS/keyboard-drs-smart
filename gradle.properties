# === V 1.0.3 — البحث الذكي الجيل الثاني + شعارات متجددة ===
# V 1.0.3 — smart search v2: ranked multi-token matching with fuzzy
# subsequence fallback + word-level highlighting + update/package/rewards/
# backup entries; daily-rotating hero taglines
# === V 1.0.6 — نظام المستخدم التقني: أدوات النصوص المتقدمة + تخصيص الشريط التقني + الأداء والتشخيص ===
# V 1.0.6 — technical user system: real text-tools engine on the input
# connection, editable shortcuts with {cursor}, customizable tech strip,
# measured performance monitor, sanitized event log, full test runner and
# validated DRS state backup/restore
# === V 1.0.9 — إصلاح انهيار التمرير المتداخل في شاشات DRS ===
# V 1.0.9 — crash-fix release: nested vertical scroll containers in the DRS
# screens (unified dashboard, unified tools, performance, tech toolbar) were
# measured with infinite height constraints and crashed on open; the
# diagnostics event log scroll received unbounded constraints too. The
# screens now rely on DrsScreen's single scroll container, the event log
# bounds its height before the scroll modifier, and DrsScreen documents the
# scrollable = false convention to prevent the pattern from recurring.
# === V 1.2.0 — جولة تطوير شاملة: أداتا خفاء وتصحيح، إحاطة اقتباس، مقياس شريط ذكي، إجماليات وسلسلة نشاط ===
# V 1.2.0 — comprehensive round: incognito + autocorrect catalogue tools
# (real engine toggles), a locale-aware wrap-in-quotes text operation, a
# real smartbar height scale applied at the sizing layer, and an
# all-time totals card with activity streak and best-day lines computed
# purely from the local daily buckets.
# === V 1.3.0 — جولة شاملة ثالثة: تصحيح حقيقي للتصحيح التلقائي، أرقام ١٢٣↔123، تطويل، تكثيف أسطر، إفراغ حافظة، إدخال صوتي، فحوص طاقة/اهتزاز/ثيم، عدّادات أرقام/رموز، أسبوع بأسبوع ===
# V 1.3.0 — third comprehensive round: REAL autocorrect toggle (the v1.2.0
# handler was still a placeholder toast), four pure text operations
# (Arabic/Western digit conversion, tatweel removal, blank-line collapse),
# two more real catalogue tools (clipboard clear + voice input, 31 total),
# three more real diagnostics checks (battery/power-save, vibration
# amplitude capability, active-theme health; 24 total), the previously
# dropped number/symbol counters now persisted into the daily buckets and
# CSV, a week-over-week growth line, and per-key-category sound-pitch
# variation.
# === V 1.4.0 — الجولة الشاملة الرابعة: فرز تنازلي، توحيد حروف عربية، نافذة عائمة، إظهار/إخفاء الشريط الذكي، فحصا زمن استجابة وذاكرة، أيام نشطة ومتوسط يومي ===
# V 1.4.0 — fourth comprehensive round: a descending line-sort text op
# (the real counterpart of SORT_LINES), an Arabic letter-normalization op
# (hamza carriers -> bare alef, ta-marbuta -> ha, alef maqsura -> ya),
# two more real catalogue tools (floating window + smartbar visibility,
# 33 total, both handled by existing engine actions), two more real
# diagnostics checks (p95 key latency and Java-heap pressure from the
# in-process performance window; 26 total, unknown never false-alarms),
# and active-days / per-active-day average stats lines computed purely
# from the local daily buckets.
# === V 1.5.0 — الجولة الشاملة الخامسة: إصلاح أداة اللغة ومفتاحي Tab/Esc، ثماني عمليات نصية جديدة، ثلاث أدوات كتالوج، أسماء بلاطات حقيقية، إحصاءات أطول سلسلة وأكثر يوم، فحوص تشخيص ثلاثة، سقف نسخة النسخ الاحتياطي، زر تبديل الثيم وإصلاح تسريب محرك الثيمات ===
# V 1.5.0 — fifth comprehensive round: the language catalogue tool fixed
# from a silent no-op (IME_SUBTYPE_PICKER had no handler) to the real
# subtype-picker path, tech-toolbar Tab/Esc keys now handled (real tab
# commit / hide UI), eight more pure text ops (toggle case, Arabic
# punctuation, zero-width cleanup keeping ZWNJ, tabs to spaces, sort by
# length, word-level dedup, paren wrapping, one sentence per line; 34
# total) plus Persian-digit support in TO_ARABIC_DIGITS, three more
# catalogue tools (unpinned-history wipe, next language, resize mode; 36
# total), most-used tiles now show real text-tool names instead of the
# invalid-fatal placeholder, three more pure stats aggregations (longest
# streak, busiest weekday, recorded span) and a gap-free zero-filled CSV
# export, three more diagnostics checks (spell-checker wiring,
# notification permission, haptics configuration; 29 total), a schema
# version ceiling on backup import, a cycle-theme entry point on the
# theme screen, and the ThemeManager loaded-dir leak fixed (bounded
# cache, evicted dirs physically deleted).
# === V 1.6.0 — الجولة الشاملة السادسة: إصلاح بلاطتَي مسح سجل الحافظة واللغة التالية من العنصر الفاشل العام، خمس أدوات كتالوج جديدة (مسح الحافظة كاملة، اللغة السابقة، يسار/يمين اليد الواحدة، اللوحة التالية)، أربع عمليات نصية جديدة (مسافات إلى تبويبات، الترقيم الغربي، تنظيف الحواف الفارغة، عكس ترتيب الكلمات)، مقياس حجم معاينة المفاتيح، عدّاد قبول الاقتراحات حتى CSV، فحصا تشخيص سلامة ملف الحالة وسجل الانهيار، وثلاثة تجميعات إحصاء جديدة ===
# V 1.6.0 — sixth comprehensive round: the two remaining most-used-tile
# placeholders fixed (CLIPBOARD_CLEAR_HISTORY / IME_NEXT_SUBTYPE showed
# the invalid-fatal label), five more catalogue tools on real engine
# actions (full-history wipe, previous language, one-handed left/right
# edges, next keyboard app; 41 total), four more pure text ops (spaces
# to tabs, western punctuation, edge-only blank trim, word-order
# reversal; 38 total), a key-preview size scale (70-200%) applied in the
# popup bounds provider, an end-to-end suggestion-accept counter (engine
# → daily buckets → totals card → CSV), two more diagnostics checks
# (state-file decode integrity as an ERROR, previous crash-log present
# as a warning; 31 total), and three more pure stats aggregations
# (missed days, active-day ratio, quietest weekday).
