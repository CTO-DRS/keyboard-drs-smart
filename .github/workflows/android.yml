name: DRS Smart Keyboard CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "docs/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-verify:
    name: Build, Test, Lint & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint (static analysis — non-blocking: known AGP 9.0 K2 lint crash
            "Unexpected failure during lint analysis of KtLambdaExpression" hits
            random detectors/files; reports are published for review instead)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drs-lint-reports
          path: "**/build/reports/lint-results-debug.*"
          retention-days: 14
          if-no-files-found: ignore

      - name: Verify debug APK structure
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" > /dev/null
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "resources.arsc"
          sha256sum "$APK"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drs-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
