name: DRS Smart Keyboard Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Signed Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute release name (V <version without leading v>)
        run: echo "RELEASE_NAME=DRS Smart Keyboard V ${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Assert release tag matches gradle.properties version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Tag version: $TAG"
          grep -E "^projectVersionName=${TAG//./\\.}$" gradle.properties \
            || { echo "::error::gradle.properties projectVersionName does not match tag v$TAG"; exit 1; }
          grep -E "^projectVersionCode=[0-9]+$" gradle.properties \
            || { echo "::error::projectVersionCode missing or invalid in gradle.properties"; exit 1; }

      - name: Run unit tests (release gate)
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing keystore
        env:
          DRS_KEYSTORE_B64: ${{ secrets.DRS_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$DRS_KEYSTORE_B64" | base64 -d > keystore/DRS-Release-Key.keystore
          test -s keystore/DRS-Release-Key.keystore

      - name: Build signed release APK & AAB
        env:
          DRS_KEYSTORE_PASSWORD: ${{ secrets.DRS_KEYSTORE_PASSWORD }}
          DRS_KEY_ALIAS: ${{ secrets.DRS_KEY_ALIAS }}
          DRS_KEY_PASSWORD: ${{ secrets.DRS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "dist/DRS-Smart-Keyboard-v${TAG}.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/DRS-Smart-Keyboard-v${TAG}.aab"
          fi
          # Official packages for the DRS Package Center
          if compgen -G "packages/pkg-*.flex" > /dev/null; then
            cp packages/pkg-*.flex dist/
          fi
          ls -la dist/

      - name: Compute SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release with artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.RELEASE_NAME }}
          body_path: .github/RELEASE_BODY.md
          files: |
            dist/*.apk
            dist/*.aab
            dist/*.flex
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
